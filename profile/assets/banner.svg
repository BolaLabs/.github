<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="BolaLabs — Automation, integration and applied AI, running in production">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="1" stop-color="#0b1426"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a3e635"/>
      <stop offset="1" stop-color="#7fc528"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7fc528" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#7fc528" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <style>
      .s{font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
      .m{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .g{animation:g 6s ease-in-out infinite;transform-origin:880px 180px}
      .dot{animation:d 2s ease-in-out infinite}
      .r1{animation:in .5s ease-out .4s both}
      .r2{animation:in .5s ease-out .9s both}
      .r3{animation:in .5s ease-out 1.4s both}
      .r4{animation:in .5s ease-out 1.9s both}
      .cur{animation:b 1.1s steps(1) infinite}
      @keyframes g{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.1)}}
      @keyframes d{0%,100%{opacity:1}50%{opacity:.35}}
      @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
      @keyframes b{50%{opacity:0}}
    </style>
  </defs>

  <rect width="1200" height="360" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="18" fill="url(#grid)"/>
  <circle class="g" cx="880" cy="180" r="260" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>

  <g class="s">
    <rect x="64" y="58" width="318" height="30" rx="15" fill="#7fc528" fill-opacity="0.08" stroke="#7fc528" stroke-opacity="0.45"/>
    <circle class="dot" cx="84" cy="73" r="4" fill="#7fc528"/>
    <text x="98" y="78" fill="#a3e635" font-size="13" font-weight="600" letter-spacing="2.5" class="m">AUTOMAÇÃO · INTEGRAÇÃO · IA</text>
    <text x="62" y="150" fill="#ffffff" font-size="62" font-weight="700" letter-spacing="-1.5">BolaLabs</text>
    <text x="64" y="196" fill="#e2e8f0" font-size="25" font-weight="500">Automation, integration and applied AI —</text>
    <text x="64" y="228" fill="url(#lime)" font-size="25" font-weight="600">running in production, not in slides.</text>
    <text x="64" y="290" fill="#94a3b8" font-size="15">Technical Excellence Award — PRIMAVERA 2019   ·   17+ years since 2007</text>
  </g>

  <!-- terminal -->
  <g transform="translate(700 70)">
    <rect width="440" height="220" rx="12" fill="#0b1222" stroke="#ffffff" stroke-opacity="0.10"/>
    <rect width="440" height="34" rx="12" fill="#152033"/>
    <rect y="22" width="440" height="12" fill="#152033"/>
    <circle cx="20" cy="17" r="5" fill="#334155"/><circle cx="38" cy="17" r="5" fill="#334155"/><circle cx="56" cy="17" r="5" fill="#334155"/>
    <text x="78" y="22" fill="#64748b" font-size="13" class="m">bolalabs — status</text>
    <g class="m" font-size="14">
      <text x="22" y="66" fill="#e2e8f0"><tspan fill="#7fc528">$</tspan> bolalabs status</text>
      <g class="r1"><text x="22" y="102" fill="#e2e8f0">Community Platform</text><circle cx="306" cy="97" r="4" fill="#7fc528"/><text x="318" y="102" fill="#a3e635">in production</text></g>
      <g class="r2"><text x="22" y="130" fill="#e2e8f0">GitHub Repo Manager</text><circle cx="306" cy="125" r="4" fill="#7fc528"/><text x="318" y="130" fill="#a3e635">in production</text></g>
      <g class="r3"><text x="22" y="158" fill="#e2e8f0">AITOOL for Primavera</text><text x="318" y="158" fill="#94a3b8">v2.22.2</text></g>
      <g class="r4"><text x="22" y="196" fill="#e2e8f0"><tspan fill="#7fc528">$</tspan><tspan class="cur" fill="#7fc528"> ▍</tspan></text></g>
    </g>
  </g>
</svg>
